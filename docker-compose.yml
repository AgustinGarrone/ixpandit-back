services:
  db:
    image: postgres:16-alpine
    container_name: ixp-pok-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ixp-pokemon-db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d ixp-pokemon-db']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ixp-pok-api
    restart: unless-stopped
    ports:
      - '8100:8100'
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/ixp-pokemon-db
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      APP_PORT: 8100
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_AUTH_TTL_MS: ${THROTTLE_AUTH_TTL_MS:-60000}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      POKEAPI_CACHE_TTL_MS: ${POKEAPI_CACHE_TTL_MS:-86400000}
      POKEAPI_CACHE_MAX_DETAILS: ${POKEAPI_CACHE_MAX_DETAILS:-300}
      POKEAPI_CACHE_MAX_TYPES: ${POKEAPI_CACHE_MAX_TYPES:-20}
      POKEAPI_CACHE_MAX_PAGES: ${POKEAPI_CACHE_MAX_PAGES:-30}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
