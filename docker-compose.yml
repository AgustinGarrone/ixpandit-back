services:
  db:
    image: postgres:16-alpine
    container_name: ixp-pok-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gts-pokemon-db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d gts-pokemon-db']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ixp-pok-api
    restart: unless-stopped
    ports:
      - '8100:8100'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/gts-pokemon-db
      APP_PORT: 8100
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
